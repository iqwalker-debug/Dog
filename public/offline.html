<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Refuge</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: #FAF7F0; color: #1B2233;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center; padding: 2rem;
      }
      h1 { font-family: Georgia, serif; color: #1B2F5A; margin: 0 0 0.5rem; }
      p { color: #5A6377; max-width: 32rem; }
      button {
        margin-top: 1.5rem; border: 0; background: #1B2F5A; color: #FFFDF8;
        padding: 0.75rem 1.5rem; border-radius: 999px; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Recently viewed pages and sermons will still work. Reconnect to see the latest from Refuge.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
