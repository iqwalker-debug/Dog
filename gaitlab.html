<!doctype html><body style="margin:0"><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { createDog } from '/src/dog.js';
const q = new URLSearchParams(location.search), breed = q.get('breed') || 'husky', speed = +(q.get('speed') || 3.2);
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true }); r.setSize(900, 420); r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dfe9ef');
scene.add(new THREE.HemisphereLight('#ffffff', '#887766', 1.6)); const sun = new THREE.DirectionalLight('#fff1d0', 2); sun.position.set(2, 6, 4); sun.castShadow = true; scene.add(sun);
const ground = (x, z) => q.has('bumpy') ? 0.22 * Math.sin(x * 1.3) : 0;
const gg = new THREE.PlaneGeometry(200, 6, 400, 1).rotateX(-Math.PI / 2); const P = gg.attributes.position;
for (let i = 0; i < P.count; i++) P.setY(i, ground(P.getX(i), P.getZ(i))); gg.computeVertexNormals();
const gm = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ color: '#c9b98a' })); gm.receiveShadow = true; scene.add(gm);
for (let x = -100; x < 100; x += 1) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.01, 6), new THREE.MeshBasicMaterial({ color: '#8a7a55' })); m.position.set(x, ground(x, 0) + 0.006, 0); scene.add(m); }
const dog = createDog(breed); dog.setGround(ground); dog.group.rotation.y = Math.PI / 2; scene.add(dog.group);
const cam = new THREE.PerspectiveCamera(30, 900 / 420, 0.1, 100);
let x = -6; const dt = 1 / 60;
for (let f = 0; f < 120; f++) { x += speed * dt; dog.group.position.x = x; dog.update(dt, speed, false, ground(x, 0)); }
window.step = (n) => { for (let f = 0; f < n; f++) { x += speed * dt; dog.group.position.x = x; dog.update(dt, speed, false, ground(x, 0)); }
  cam.position.set(x, ground(x,0) + 0.9, 4.6); cam.lookAt(x, ground(x,0) + 0.5, 0); r.render(scene, cam); };
window.ready = true;
</script></body>
