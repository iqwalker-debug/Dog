<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed painted 3D world; a thin paper HUD on top, a paper drawer on the right for kennel screens, battle controls docked to the bottom. */
:root {
  --paper: rgba(250, 244, 228, .93);
  --paper-solid: #faf4e4;
  --paper-2: #f0e6cc;
  --ink: #2f281d;
  --ink-dim: #6e6350;
  --line: rgba(95, 74, 40, .2);
  --sun: #e1a02f;       /* accent: afternoon sun */
  --sun-ink: #3a2606;
  --creek: #227f7b;
  --void: #7a3fd0;
  --hurt: #c4473b;
  --stam: #2d78ba;
  --font-display: "Grandstander", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: #9cc7d8; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--creek); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#ui > * { pointer-events: auto; }
.paper { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(40, 30, 10, .18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* HUD */
#ui > .hud { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.brand { padding: 6px 14px; display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--font-display); font-size: 22px; color: #a2611a; }
.brand span { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-dim); font-weight: 700; }
.res { padding: 7px 12px; display: flex; gap: 12px; flex-wrap: wrap; }
.res span { display: inline-flex; gap: 5px; align-items: baseline; font-family: var(--font-data); font-size: 13.5px; }
.res b { font-family: var(--font-body); font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-dim); }
.tabs { padding: 4px; display: flex; gap: 2px; margin-left: auto; overflow-x: auto; max-width: 100%; }
.tab { background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--ink-dim); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--sun); color: var(--sun-ink); }
.tab:hover:not([aria-selected="true"]):not(:disabled) { color: var(--ink); background: rgba(0,0,0,.05); }
.tab:disabled { opacity: .4; cursor: not-allowed; }

/* Drawer */
.drawer { position: absolute; top: 74px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(460px, calc(100% - 24px)); overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
@media (max-width: 720px) { .drawer { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); width: auto; max-height: 62vh; } }
.drawer .close { position: sticky; top: -6px; justify-self: end; margin-bottom: -40px; z-index: 1; }
.drawer h2 { font-size: 22px; }
.sub { color: var(--ink-dim); margin: 0; }
.eyebrow { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-dim); font-weight: 700; }
.btn { background: var(--paper-solid); border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--sun); }
.btn.primary { background: var(--sun); border-color: #c98a1f; color: var(--sun-ink); }
.btn.danger { color: var(--hurt); border-color: rgba(196,71,59,.5); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn .cost { font-family: var(--font-data); font-size: 11.5px; opacity: .8; font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.portrait { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--paper-2); display: block; flex: none; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.dcard { background: var(--paper-solid); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; justify-items: center; gap: 2px; text-align: center; cursor: pointer; position: relative; font-size: 12.5px; }
.dcard[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun) inset; }
.dcard .nm { font-weight: 700; font-size: 14px; }
.dcard .br { color: var(--ink-dim); font-size: 11.5px; }
.dcard .pm { position: absolute; top: 5px; right: 7px; font-size: 10px; color: #a2611a; font-weight: 700; letter-spacing: 1px; }
.badge { display: inline-block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; border-radius: 999px; padding: 1px 7px; border: 1px solid currentColor; }
.b-puppy { color: #a86f00; } .b-adult { color: #3f7d22; } .b-senior { color: #6a55b5; }
.bar { height: 7px; background: rgba(60,40,10,.12); border-radius: 99px; overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .3s; }
.bar.hp i { background: #4f9a3a; } .bar.st i { background: var(--stam); } .bar.ehp i { background: var(--void); }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--paper-solid); border-radius: 8px; padding: 7px 9px; border: 1px solid var(--line); }
.stat .k { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-dim); font-weight: 700; }
.stat .v { font-family: var(--font-data); font-size: 17px; }
.stat .h { font-size: 11px; color: var(--ink-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12px; background: var(--paper-solid); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.chip.sig { border-color: var(--sun); color: #8a5310; font-weight: 700; }
.chip.locked { opacity: .45; border-style: dashed; }
.trait { border-left: 3px solid var(--sun); padding: 4px 10px; background: rgba(225,160,47,.1); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.life { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.life div { height: 7px; border-radius: 4px; background: rgba(60,40,10,.1); overflow: hidden; }
.life div i { display: block; height: 100%; background: var(--creek); }
.lifel { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 1px; text-transform: uppercase; }
.shop { display: grid; gap: 10px; }
.scard { background: var(--paper-solid); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 4px 12px; align-items: center; }
.scard .portrait { width: 72px; height: 72px; grid-row: span 3; }
.r-common { color: var(--ink-dim); } .r-uncommon { color: var(--creek); } .r-rare { color: #a2611a; }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.bcell { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--paper-solid); border: 1px solid var(--line); font-size: 12px; display: grid; justify-items: center; gap: 3px; }
.bcell.missing img { filter: brightness(0) opacity(.25); }
.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
.cmp th, .cmp td { padding: 6px 7px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp th { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-dim); }
.pips { color: var(--sun); letter-spacing: 1px; } .pips .off { color: rgba(60,40,10,.18); }
.tablewrap { overflow-x: auto; }
.guide p { margin: 0; }

/* Expedition HUD */
.pack { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 74px; padding: 10px; display: grid; gap: 8px; width: 250px; }
.mini { display: flex; gap: 8px; align-items: center; }
.mini img { width: 40px; height: 40px; border-radius: 50%; flex: none; }
.mini .m { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: 12.5px; }
.loot { font-family: var(--font-data); font-size: 12.5px; }
.goal { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); }
.setout { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding: 14px; display: grid; gap: 10px; width: min(620px, calc(100% - 24px)); }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button { display: flex; gap: 8px; align-items: center; padding: 5px 10px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-solid); cursor: pointer; font-weight: 700; font-size: 13px; }
.pick button img { width: 34px; height: 34px; border-radius: 50%; }
.pick button[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun) inset; }
@media (max-width: 720px) { .pack { width: auto; max-width: 210px; top: auto; bottom: 160px; padding: 8px; } .pack .hidesm { display: none; } .goal { left: auto; right: max(12px, env(safe-area-inset-right, 0px)); transform: none; } }
#mini { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 74px; width: 150px; height: 190px; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(40,30,10,.18); z-index: 1; background: var(--paper-solid); }
@media (max-width: 720px) { #mini { width: 96px; height: 122px; top: 120px; } }

/* Joystick */
#joy { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; background: rgba(250,244,228,.35); border: 2px solid rgba(250,244,228,.7); z-index: 3; touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(250,244,228,.9); box-shadow: 0 4px 12px rgba(0,0,0,.2); }

/* Battle */
.battle { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 12px; display: grid; gap: 10px; max-height: 56vh; overflow-y: auto; }
.fighters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 640px) { .fighters { grid-template-columns: 1fr; } }
.fcol { display: grid; gap: 6px; align-content: start; }
.fighter { display: flex; gap: 8px; align-items: center; background: var(--paper-solid); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.fighter img { width: 38px; height: 38px; border-radius: 50%; flex: none; }
.fighter.active { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun) inset; }
.fighter.down { opacity: .4; filter: grayscale(1); }
.fighter.foe { cursor: pointer; }
.fighter.targeted { border-color: var(--void); box-shadow: 0 0 0 2px var(--void) inset; }
.fighter .m { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: 12px; }
.fighter .nm { display: flex; justify-content: space-between; gap: 6px; font-weight: 700; font-size: 13px; }
.voidico { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #a66cff, #1d0b35 70%); display: grid; place-items: center; color: #f0dcff; font-weight: 800; font-size: 10px; flex: none; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 4px; background: rgba(60,40,10,.07); color: var(--ink-dim); }
.moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px; }
.move { text-align: left; background: var(--paper-solid); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; cursor: pointer; display: grid; gap: 1px; }
.move:hover:not(:disabled) { border-color: var(--sun); }
.move.sig { border-color: rgba(225,160,47,.7); background: #fff3d6; }
.move:disabled { opacity: .35; cursor: not-allowed; }
.move .t { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; font-size: 13.5px; }
.move .t .cost { font-family: var(--font-data); color: var(--stam); font-size: 11.5px; }
.move .d { font-size: 11.5px; color: var(--ink-dim); }
@media (max-height: 760px) { .battle { max-height: 46vh; gap: 6px; padding: 8px; } .move .d { display: none; } .fighter { padding: 3px 6px; } .fighter img, .voidico { width: 28px; height: 28px; } .fighter .tags { display: none; } .blog { max-height: 44px !important; } }
.blog { font-size: 12.5px; max-height: 84px; overflow-y: auto; display: grid; gap: 1px; }
.blog .miss { color: var(--ink-dim); } .blog .bad { color: var(--hurt); } .blog .good { color: #3f7d22; } .blog .void { color: var(--void); } .blog .pup { color: #96630a; }

/* FX + toast + modal */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.pop { position: absolute; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 8px rgba(0,0,0,.25); transform: translate(-50%, -50%); white-space: nowrap; }
.pop.bad { color: #ffd0c8; } .pop.good { color: #d6ffc2; } .pop.miss { color: #f2ead8; font-size: 16px; } .pop.void { color: #e8d0ff; }
.toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); padding: 9px 16px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; z-index: 5; }
.modal { position: absolute; inset: 0; z-index: 6; background: rgba(30,22,8,.35); display: grid; place-items: center; padding: 16px; }
.modal .paper { max-width: 500px; width: 100%; display: grid; gap: 12px; padding: 18px; }
.start { position: absolute; inset: 0; overflow-y: auto; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.start > .paper { padding: 22px; display: grid; gap: 14px; max-width: 900px; width: 100%; }
.start h1 { font-size: clamp(40px, 8vw, 72px); color: #a2611a; line-height: .95; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.starters .scard { grid-template-columns: 1fr; justify-items: center; text-align: center; }
.starters .scard .portrait { width: 104px; height: 104px; grid-row: auto; }
.fps { position: fixed; left: 50%; top: 4px; transform: translateX(-50%); font-family: var(--font-data); font-size: 11px; background: rgba(0,0,0,.45); color: #fff; padding: 1px 8px; border-radius: 99px; z-index: 9; pointer-events: none; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--ink); z-index: 10; background: #e9dfc4; padding: 16px; text-align: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun) inset; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fx"></div>
<canvas id="mini" width="150" height="190" hidden></canvas>
<div id="joy" hidden><i></i></div>
<div id="ui"></div>
<div class="loading" id="loading">Painting the greenbelt…</div>
<div class="fps" id="fps" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
"use strict";
// =====================================================================
// UTILITIES
// =====================================================================
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) % 1000; }
function hash2(ix, iy, s) { let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(s, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy); const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; }
function fbm(x, y, s, o = 4) { let v = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { v += a * vnoise(x * f, y * f, s + i * 17); n += a; f *= 2.03; a *= .5; } return v / n; }
function vnoise3(x, y, z) { return (vnoise(x + z * 1.7, y - z * 0.9, 3) + vnoise(y + x * 0.6, z + y * 1.3, 5)) * 0.5; }
const C = h => new THREE.Color(h);
function mixHex(a, b, t) { return '#' + C(a).lerp(C(b), t).getHexString(); }
function at(o, x, y, z) { o.position.set(x, y, z); return o; }

// =====================================================================
// GAME DATA
// =====================================================================
const STAGES = {
  puppy:  { label: 'Puppy',  stamina: 30, acc: 0.62, cost: 1.25, wis: 2, pow: 0.85, hp: 0.8, obey: 0.55, energy: 3, balance: 1, wisdom: 1, blurb: 'Bursting with energy but clumsy, and doesn’t always listen.' },
  adult:  { label: 'Adult',  stamina: 12, acc: 0.93, cost: 0.75, wis: 4, pow: 1.15, hp: 1.0, obey: 0.97, energy: 2, balance: 3, wisdom: 2, blurb: 'Balanced and capable: lands its moves and spends stamina carefully.' },
  senior: { label: 'Senior', stamina: 8,  acc: 0.88, cost: 0.85, wis: 8, pow: 1.0,  hp: 0.9, obey: 1.0,  energy: 1, balance: 2, wisdom: 3, blurb: 'Wise, with the biggest bag of tricks, but tires quickly.' },
};
const ADULT_AT = 6, SENIOR_AT = 18;

// look: s size, leg/len/snout multipliers, ears, tail, fur, c colours, pattern
const BREEDS = {
  golden:      { name: 'Golden Retriever', rarity: 'common', hp: 46, atk: 9, def: 4, sig: 'nuzzle', trait: 'Warm Heart', traitDesc: 'Heals 25% more.',
                 look: { s: 1, leg: 1, len: 1, snout: 1, ears: 'floppy', tail: 'plume', fur: 'fluffy', c: { body: '#d79a44', belly: '#e7bd70', muzzle: '#e0ad5e', ear: '#c4842f', leg: '#d39745' } } },
  labrador:    { name: 'Labrador Retriever', rarity: 'common', hp: 48, atk: 9, def: 4, sig: 'cannonball', trait: 'Water Dog', traitDesc: 'The pack heals while wading in the creek.',
                 look: { s: 1, leg: 1, len: 1, snout: 1.05, ears: 'floppy', tail: 'otter', fur: 'smooth', eye: '#6b3d14', c: { body: '#201d1e', muzzle: '#2b2727', ear: '#1b1819' } } },
  goldendoodle:{ name: 'Goldendoodle', rarity: 'common', hp: 44, atk: 9, def: 4, sig: 'happybounce', trait: 'Social Butterfly', traitDesc: 'Gains bond 25% faster.',

    case 'party': toggleParty(ui.sel); break;
    case 'endday': endDay(); break;
    case 'adopt': { const it = S.shop[+el.dataset.i], price = PRICE[BREEDS[it.breed].rarity]; if (it.sold || S.coins < price || S.dogs.length >= 12) break; S.coins -= price; it.sold = true; const dog = makeDogData(it.breed); S.dogs.push(dog); const isNew = !S.seen[it.breed]; S.seen[it.breed] = 1; ui.sel = dog.id; save(); syncActors(); toast(`Welcome home, ${dog.name}!${isNew ? ' New breed added to your Breed Book.' : ''}`); break; }
    case 'startrun': startRun(); break;
    case 'fieldfeed': feedInField(+el.dataset.id); break;
    case 'gohomeask': ui.modal = `<h2>Head home?</h2><p class="sub">You’ll bank ${run.loot.coins} coins and ${run.loot.treats} treats, and the day will end.</p><div class="row"><button class="btn primary" data-act="gohome">Head home</button><button class="btn" data-act="closemodal">Keep exploring</button></div>`; renderUI(); break;
    case 'gohome': goHome(false); break;
    case 'losthome': goHome(true); break;
    case 'closemodal': ui.modal = null; renderUI(); break;
    case 'closebattle': ui.modal = null; endBattleCleanup(); save(); renderUI(); break;
    case 'target': if (B) { const i = +el.dataset.i; if (B.foes[i].hp > 0) { B.target = i; renderUI(); } } break;
    case 'move': useMove(el.dataset.k); break;
    case 'flee': fleeBattle(); break;
    case 'quality': S.quality = el.dataset.k; save(); applyQuality(); renderUI(); break;
    case 'fps': S.showFps = el.checked; save(); break;
    case 'resetask': ui.modal = `<h2>Start a new game?</h2><p class="sub">This erases your kennel, coins and progress in this browser.</p><div class="row"><button class="btn danger" data-act="reset">Erase and restart</button><button class="btn" data-act="closemodal">Cancel</button></div>`; renderUI(); break;
    case 'reset': try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = newState(); run = null; B = null; ui = { tab: 'world', sel: null, toast: null, modal: null }; clearActors(); enterHome(); renderUI(); break;
  }
}

// =====================================================================
// BOOT
// =====================================================================
function start(hot) {
  S = (hot && hot.S) || load() || newState();
  run = S.run && S.run.seed ? S.run : null;
  if (S.started && !S.shop.length) rollShop();
  applyQuality();
  loadModels();
  if (run) enterRunWorld(); else enterHome();
  renderUI();
  const l = document.getElementById('loading'); if (l) l.remove();
  loop();
}
window.claude?.hot?.snapshot?.(() => ({ S: Object.assign({}, S, { run }) }));
addEventListener('pagehide', () => { if (S) save(); });
try { window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); }
catch (err) { const l = document.getElementById('loading'); if (l) l.textContent = 'Pawbound needs WebGL, which isn’t available in this browser.'; console.error(err); }
</script>
</body>
</html>
