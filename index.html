<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a camp-journal HUD — sticky resource bar, tabbed screens, one focused panel at a time; battles take over the screen. */
:root {
  --void: #110e1c;        /* page ground: the night before the void */
  --dusk: #1c1730;        /* panels */
  --dusk-2: #262040;      /* raised controls */
  --line: #3a3158;        /* hairlines */
  --bone: #efe6d6;        /* primary text */
  --bone-dim: #b3a9c4;    /* secondary text */
  --kibble: #f2a541;      /* accent: warm amber */
  --kibble-ink: #2a1a05;
  --rift: #b04cff;        /* monsters / void */
  --heal: #6fd18a;
  --hurt: #ff6b6b;
  --stam: #5fb8ff;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--bone);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  background-image: radial-gradient(ellipse at 80% -10%, rgba(176,76,255,.18), transparent 55%),
                    radial-gradient(ellipse at 0% 110%, rgba(242,165,65,.10), transparent 50%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--dusk); }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--kibble); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .5px; text-wrap: balance; margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--dusk); border-bottom: 1px solid var(--line); }
.hud .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.logo { font-family: var(--font-display); font-size: 26px; color: var(--kibble); line-height: 1; display: flex; align-items: center; gap: 8px; }
.logo small { font-family: var(--font-body); font-size: 12px; color: var(--bone-dim); letter-spacing: 1.5px; text-transform: uppercase; }
.res { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
.res span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-data); font-size: 14px; }
.res b { font-family: var(--font-body); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--bone-dim); font-weight: 700; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; }
.tab { background: none; border: 0; padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--bone-dim); font-weight: 700; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--kibble); color: var(--kibble-ink); }
.tab:hover:not([aria-selected="true"]) { color: var(--bone); background: var(--dusk-2); }

main { padding-block: 18px 60px; }
.screen { display: grid; gap: 16px; }
.panel { background: var(--dusk); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h2 { font-size: 22px; margin-bottom: 4px; }
.sub { color: var(--bone-dim); margin: 0 0 12px; }
.eyebrow { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--bone-dim); font-weight: 700; }

.btn { background: var(--dusk-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--kibble); }
.btn.primary { background: var(--kibble); color: var(--kibble-ink); border-color: var(--kibble); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { border-color: var(--hurt); color: var(--hurt); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn .cost { font-family: var(--font-data); font-size: 12px; opacity: .8; font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Kennel */
.kennel { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .kennel { grid-template-columns: 1fr; } }
.doggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.dogcard { background: var(--dusk-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; display: grid; justify-items: center; gap: 2px; text-align: center; position: relative; }
.dogcard[aria-pressed="true"] { border-color: var(--kibble); box-shadow: 0 0 0 1px var(--kibble) inset; }
.dogcard .nm { font-weight: 700; }
.dogcard .br { font-size: 12px; color: var(--bone-dim); }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; }
.b-puppy { color: #ffd36b; } .b-adult { color: var(--heal); } .b-senior { color: #c7b8ff; }
.b-party { color: var(--kibble); }
.dogcard .partymark { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--kibble); font-weight: 700; }
.bondbar, .bar { height: 7px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; width: 100%; }
.bondbar i, .bar i { display: block; height: 100%; background: var(--kibble); border-radius: 99px; transition: width .3s; }
.bar.hp i { background: var(--heal); } .bar.st i { background: var(--stam); } .bar.ehp i { background: var(--rift); }

.detail { display: grid; gap: 12px; align-content: start; }
.dhead { display: flex; gap: 14px; align-items: center; }
.dhead h2 { font-size: 26px; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--dusk-2); border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--bone-dim); font-weight: 700; }
.stat .v { font-family: var(--font-data); font-size: 18px; }
.stat .h { font-size: 12px; color: var(--bone-dim); }
.pips { color: var(--kibble); letter-spacing: 2px; }
.pips .off { color: var(--line); }
.movelist { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; background: var(--dusk-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.chip.sig { border-color: var(--kibble); color: var(--kibble); }
.chip.locked { opacity: .45; border-style: dashed; }
.lifeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.lifeline div { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.lifeline div i { position: absolute; inset: 0 auto 0 0; background: var(--bone-dim); }
.lifelabels { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 11px; color: var(--bone-dim); letter-spacing: 1px; text-transform: uppercase; }
.trait { border-left: 3px solid var(--kibble); padding: 4px 10px; background: rgba(242,165,65,.06); border-radius: 0 6px 6px 0; }

/* Adopt / book */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.shopcard { background: var(--dusk-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.rarity-common { color: var(--bone-dim); } .rarity-uncommon { color: var(--stam); } .rarity-rare { color: var(--kibble); }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.bookcell { text-align: center; padding: 8px; border-radius: 8px; background: var(--dusk-2); font-size: 12.5px; }
.bookcell.missing svg { filter: brightness(0) opacity(.35); }
.bookcell.missing .bn { color: var(--bone-dim); }

/* Map */
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
@media (max-width: 860px) { .mapwrap { grid-template-columns: 1fr; } }
canvas#map { width: 100%; max-width: 100%; height: auto; display: block; border-radius: var(--r); border: 1px solid var(--line); image-rendering: pixelated; touch-action: manipulation; background: #0a0812; }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; justify-content: center; }
.dpad button { border-radius: 10px; background: var(--dusk-2); border: 1px solid var(--line); font-size: 20px; cursor: pointer; }
.side { display: grid; gap: 12px; align-content: start; }
.mini { display: flex; gap: 8px; align-items: center; }
.mini .meta { flex: 1; min-width: 0; display: grid; gap: 3px; font-size: 13px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; color: var(--bone-dim); }
.party-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.party-pick .dogcard { width: 140px; }

/* Battle */
.battle { position: fixed; inset: 0; z-index: 20; background: rgba(10,8,18,.96); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.battle .wrap { padding-block: 16px; display: grid; gap: 14px; }
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .arena { grid-template-columns: 1fr; } }
.side-col { display: grid; gap: 10px; align-content: start; }
.fighter { display: flex; gap: 10px; align-items: center; background: var(--dusk); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; transition: transform .15s; }
.fighter.active { border-color: var(--kibble); box-shadow: 0 0 0 1px var(--kibble) inset, 0 0 24px rgba(242,165,65,.18); }
.fighter.down { opacity: .38; filter: grayscale(1); }
.fighter.targetable { cursor: pointer; }
.fighter.targeted { border-color: var(--rift); box-shadow: 0 0 0 1px var(--rift) inset, 0 0 24px rgba(176,76,255,.25); }
.fighter .meta { flex: 1; min-width: 0; display: grid; gap: 3px; font-size: 13px; }
.fighter .nm { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--dusk-2); color: var(--bone-dim); }
.shake { animation: shake .35s; }
.flash { animation: flash .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
@keyframes flash { 0%{filter:brightness(2.2)} 100%{filter:none} }
@media (prefers-reduced-motion: reduce) { .shake, .flash { animation: none; } }
.moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.move { text-align: left; background: var(--dusk-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; display: grid; gap: 2px; }
.move:hover:not(:disabled) { border-color: var(--kibble); }
.move.sig { border-color: rgba(242,165,65,.5); }
.move:disabled { opacity: .35; cursor: not-allowed; }
.move .t { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.move .t .cost { font-family: var(--font-data); color: var(--stam); font-size: 12px; }
.move .d { font-size: 12px; color: var(--bone-dim); }
.blog { font-size: 13.5px; max-height: 150px; overflow-y: auto; display: grid; gap: 2px; background: var(--dusk); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.blog .miss { color: var(--bone-dim); } .blog .bad { color: var(--hurt); } .blog .good { color: var(--heal); } .blog .void { color: #d29bff; } .blog .pup { color: #ffd36b; }

/* Toast + modal */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bone); color: var(--void); padding: 10px 16px; border-radius: 999px; font-weight: 700; z-index: 40; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(8,6,14,.8); display: grid; place-items: center; padding: 16px; }
.modal .panel { max-width: 520px; width: 100%; display: grid; gap: 12px; }

/* Start */
.hero { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 18px 6px; }
.hero h1 { font-size: clamp(44px, 9vw, 84px); color: var(--kibble); line-height: .95; }
.hero p { max-width: 58ch; color: var(--bone-dim); margin: 0; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

/* Guide */
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp th { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--bone-dim); }
.tablewrap { overflow-x: auto; }
.guide p { max-width: 68ch; }
</style>
</head>

<script>

  shade:   { name: 'Shade Hound',  hp: 34, atk: 9, def: 3, xp: 9,  abil: 'bite',  shape: 'shade' },
  crow:    { name: 'Hollow Crow',  hp: 26, atk: 8,  def: 2, xp: 8,  abil: 'swoop', shape: 'crow' },
  crawler: { name: 'Null Crawler', hp: 48, atk: 8,  def: 7, xp: 11, abil: 'slam',  shape: 'crawler' },
  maw:     { name: 'Rift Maw',     hp: 170, atk: 14, def: 6, xp: 45, abil: 'boss', shape: 'maw', boss: true },
};
const NAMES = ['Biscuit','Mochi','Pepper','Juniper','Waffles','Scout','Hazel','Bruno','Pickles','Nova','Ziggy','Maple','Tater','Olive','Rocket','Clover','Bean','Sable','Pretzel','Otis','Luna','Fig','Moose','Pip','Ripley','Nugget','Echo','Bramble','Dot','Huckle','Kona','Wren'];
const BOND_TIERS = [[80, 'Best Friend'], [50, 'Loyal'], [25, 'Friendly'], [0, 'Wary']];

// ============================================================
// STATE
// ============================================================
const SAVE_KEY = 'pawbound-save-v1';
let S = null;          // persistent game state
let ui = { tab: 'kennel', sel: null, toast: null, modal: null };
let run = null;        // active expedition (also persisted inside S.run)
let B = null;          // active battle (transient)

const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function save() {
  try { S.run = run; localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ }
}
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function newState() {
  return { day: 1, coins: 60, treats: 6, care: 3, dogs: [], party: [], shop: [], nextId: 1, maxDepth: 1, started: false, seen: {}, wins: 0, run: null };
}
function makeDog(breed, opts = {}) {
  const used = new Set(S.dogs.map(d => d.name));
  const free = NAMES.filter(n => !used.has(n));
  return { id: S.nextId++, name: opts.name || pick(free.length ? free : NAMES), breed, age: opts.age ?? 0, bond: opts.bond ?? 15,
           trail: !!opts.trail, lvl: opts.lvl || 1, xp: 0, trainings: 0 };
}
function rollShop() {
  const keys = Object.keys(BREEDS);
  const w = k => BREEDS[k].rarity === 'common' ? 5 : BREEDS[k].rarity === 'uncommon' ? 3 : 1.4;
  const out = [];
  while (out.length < 3) {
    let total = keys.reduce((a, k) => a + (out.includes(k) ? 0 : w(k)), 0), r = Math.random() * total;
    for (const k of keys) { if (out.includes(k)) continue; r -= w(k); if (r <= 0) { out.push(k); break; } }
  }
  S.shop = out.map(k => ({ breed: k, sold: false }));
}

// ============================================================
// DOG MATH
// ============================================================
const stageOf = d => d.age < ADULT_AT ? 'puppy' : d.age < SENIOR_AT ? 'adult' : 'senior';
const bondTier = b => BOND_TIERS.find(([t]) => b >= t)[1];
function stats(d) {
  const br = BREEDS[d.breed], st = STAGES[stageOf(d)], lv = 1 + 0.08 * (d.lvl - 1);
  let hp = br.hp * st.hp * (1 + 0.1 * (d.lvl - 1));
  let atk = br.atk * st.pow * lv, def = br.def * lv, stamina = st.stamina;
  let acc = st.acc + Math.min(0.06, d.bond / 1600);
  if (d.breed === 'greatdane') hp *= 1.3;
  if (d.breed === 'shepherd') def *= 1.2;
  if (d.breed === 'rottweiler') atk *= 1.15;
  if (d.breed === 'husky') stamina = Math.round(stamina * 1.25);
  if (d.breed === 'collie') acc += 0.08;
  return { hp: Math.round(hp), atk, def, stamina, acc: Math.min(0.99, acc), costMult: st.cost };
}
function moveCost(d, key) { const m = MOVES[key]; return m.cost === 0 ? 0 : Math.max(1, Math.round(m.cost * STAGES[stageOf(d)].cost)); }
function movesOf(d) {
  const stage = stageOf(d), extra = d.breed === 'poodle' ? 1 : 0;
  const n = STAGES[stage].wis + extra;
  const order = stage === 'puppy' ? PUPPY_ORDER : GROWN_ORDER;
  return order.slice(0, n).map(k => k === 'SIG' ? BREEDS[d.breed].sig : k);
}
function lockedMovesOf(d) {
  const have = new Set(movesOf(d));
  const all = [...new Set([...GROWN_ORDER.map(k => k === 'SIG' ? BREEDS[d.breed].sig : k)])];
  return all.filter(k => !have.has(k));
}
function avgMovesPerTank(d) {
  const s = stats(d), ks = movesOf(d).filter(k => MOVES[k].kind !== 'guard');
  const avg = ks.reduce((a, k) => a + moveCost(d, k), 0) / ks.length;
  return Math.floor(s.stamina / avg);
}
function disobeyChance(d) {
  const st = STAGES[stageOf(d)];
  if (st.obey >= 1) return 0;
  const base = (1 - st.obey) * (1 - d.bond / 180) - d.trainings * 0.025;
  return clamp(base, stageOf(d) === 'puppy' ? 0.08 : 0, 0.6);
}
const xpNeed = lvl => 20 + lvl * 15;
function giveXP(d, n) {
  d.xp += n; const ups = [];
  while (d.xp >= xpNeed(d.lvl) && d.lvl < 30) { d.xp -= xpNeed(d.lvl); d.lvl++; ups.push(d.lvl); }
  return ups;
}
const dogById = id => S.dogs.find(d => d.id === id);

function dogSVG(breedKey, stage, size = 72) {
  const b = BREEDS[breedKey];
  const pup = stage === 'puppy', sen = stage === 'senior';
  const hr = pup ? 27 : 29, cy = pup ? 56 : 54;
  const eyeR = pup ? 5.2 : 3.8, eyeY = cy - 4;
  const muzzle = sen && b.muzzle !== '#f7f3ee' ? mix(b.muzzle, '#d9d6d0', .55) : b.muzzle;
  let ears = '';
  const E = b.ear;
  if (b.ears === 'pointy') ears = `<path d="M${50 - hr * .85} ${cy - hr * .35} L${50 - hr * .7} ${cy - hr * 1.45} L${50 - hr * .1} ${cy - hr * .85}Z" fill="${E}"/><path d="M${50 + hr * .85} ${cy - hr * .35} L${50 + hr * .7} ${cy - hr * 1.45} L${50 + hr * .1} ${cy - hr * .85}Z" fill="${E}"/>`;
  else if (b.ears === 'semi') ears = `<path d="M${50 - hr * .85} ${cy - hr * .3} L${50 - hr * .75} ${cy - hr * 1.25} L${50 - hr * .15} ${cy - hr * .85}Z" fill="${E}"/><path d="M${50 + hr * .85} ${cy - hr * .3} L${50 + hr * .95} ${cy - hr * 1.1} L${50 + hr * .15} ${cy - hr * .85}Z" fill="${E}"/>`;
  else if (b.ears === 'floppy') ears = `<ellipse cx="${50 - hr * .95}" cy="${cy - 2}" rx="${hr * .32}" ry="${hr * .62}" transform="rotate(18 ${50 - hr * .95} ${cy - 2})" fill="${E}"/><ellipse cx="${50 + hr * .95}" cy="${cy - 2}" rx="${hr * .32}" ry="${hr * .62}" transform="rotate(-18 ${50 + hr * .95} ${cy - 2})" fill="${E}"/>`;
  else if (b.ears === 'long') ears = `<ellipse cx="${50 - hr * .98}" cy="${cy + 6}" rx="${hr * .3}" ry="${hr * .8}" transform="rotate(10 ${50 - hr} ${cy})" fill="${E}"/><ellipse cx="${50 + hr * .98}" cy="${cy + 6}" rx="${hr * .3}" ry="${hr * .8}" transform="rotate(-10 ${50 + hr} ${cy})" fill="${E}"/>`;
  else if (b.ears === 'fold') ears = `<path d="M${50 - hr * .7} ${cy - hr * .7} q-14 -6 -12 10 q4 -4 14 0Z" fill="${E}"/><path d="M${50 + hr * .7} ${cy - hr * .7} q14 -6 12 10 q-4 -4 -14 0Z" fill="${E}"/>`;
  else if (b.ears === 'poof') ears = `<circle cx="${50 - hr * .95}" cy="${cy + 2}" r="${hr * .45}" fill="${E}"/><circle cx="${50 + hr * .95}" cy="${cy + 2}" r="${hr * .45}" fill="${E}"/><circle cx="50" cy="${cy - hr * .95}" r="${hr * .45}" fill="${E}"/>`;
  const mask = b.mask ? `<path d="M${50 - hr * .9} ${cy - 2} Q50 ${cy - hr * 1.3} ${50 + hr * .9} ${cy - 2} Q50 ${cy - hr * .3} ${50 - hr * .9} ${cy - 2}Z" fill="${b.mask}" opacity=".85"/>` : '';
  const blaze = b.blaze ? `<path d="M${50 - 4} ${cy - hr * .9} Q50 ${cy - hr * 1.05} ${50 + 4} ${cy - hr * .9} L${50 + 9} ${cy + 6} L${50 - 9} ${cy + 6}Z" fill="${b.blaze}"/>` : '';
  const cheeks = b.cheek ? `<circle cx="${50 - hr * .55}" cy="${cy + 6}" r="5" fill="${b.cheek}"/><circle cx="${50 + hr * .55}" cy="${cy + 6}" r="5" fill="${b.cheek}"/>` : '';
  const eyeC = b.eyes || '#1a1412';
  const shine = pup ? `<circle cx="${50 - 10}" cy="${eyeY - 2}" r="1.8" fill="#fff"/><circle cx="${50 + 12}" cy="${eyeY - 2}" r="1.8" fill="#fff"/>` : `<circle cx="${50 - 10.5}" cy="${eyeY - 1.3}" r="1.1" fill="#fff"/><circle cx="${50 + 11.5}" cy="${eyeY - 1.3}" r="1.1" fill="#fff"/>`;
  const brows = sen ? `<path d="M${50 - 16} ${eyeY - 7} l9 -2" stroke="#ddd8cf" stroke-width="2.4" stroke-linecap="round"/><path d="M${50 + 16} ${eyeY - 7} l-9 -2" stroke="#ddd8cf" stroke-width="2.4" stroke-linecap="round"/>` : '';
  const tongue = pup ? `<path d="M47 ${cy + 15} q3 8 6 0Z" fill="#ff7a90"/>` : '';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">
    ${ears}<circle cx="50" cy="${cy}" r="${hr}" fill="${b.coat}"/>${mask}${blaze}${cheeks}
    <ellipse cx="50" cy="${cy + 10}" rx="${hr * .55}" ry="${hr * .4}" fill="${muzzle}"/>
    <circle cx="${50 - 11}" cy="${eyeY}" r="${eyeR}" fill="${eyeC}"/><circle cx="${50 + 11}" cy="${eyeY}" r="${eyeR}" fill="${eyeC}"/>${shine}${brows}
    <ellipse cx="50" cy="${cy + 5}" rx="5.2" ry="3.8" fill="#1a1412"/>
    <path d="M50 ${cy + 8} v4 M44 ${cy + 13} q6 4 12 0" stroke="#1a1412" stroke-width="1.6" fill="none" stroke-linecap="round"/>${tongue}
  </svg>`;
}
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), Bc = p(b);
  return '#' + A.map((v, i) => Math.round(v + (Bc[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function monSVG(shape, size = 64) {
  const glow = `<defs><radialGradient id="g${shape}" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#7b3fd6"/><stop offset="1" stop-color="#1c0b33"/></radialGradient></defs>`;
  const eyes = (y, gap = 10, r = 4) => `<circle cx="${50 - gap}" cy="${y}" r="${r}" fill="#e9c6ff"/><circle cx="${50 + gap}" cy="${y}" r="${r}" fill="#e9c6ff"/><circle cx="${50 - gap}" cy="${y}" r="${r * .45}" fill="#fff"/><circle cx="${50 + gap}" cy="${y}" r="${r * .45}" fill="#fff"/>`;
  let body = '';
  if (shape === 'wisp') body = `<path d="M50 14 C70 34 74 52 66 70 C62 80 56 86 50 86 C44 86 36 80 34 70 C28 54 38 40 44 30 C46 40 48 42 50 14Z" fill="url(#g${shape})" stroke="#b04cff" stroke-width="2"/>${eyes(60, 7, 3.6)}`;
  else if (shape === 'shade') body = `<path d="M24 40 L30 16 L40 32 L60 32 L70 16 L76 40 C82 60 72 82 50 84 C28 82 18 60 24 40Z" fill="url(#g${shape})" stroke="#b04cff" stroke-width="2"/>${eyes(52, 11, 4.5)}<path d="M40 68 l4 6 l3 -6 l3 6 l3 -6 l3 6 l4 -6" stroke="#e9c6ff" stroke-width="2" fill="none"/>`;
  else if (shape === 'crow') body = `<path d="M50 30 L92 48 L64 52 L50 80 L36 52 L8 48Z" fill="url(#g${shape})" stroke="#b04cff" stroke-width="2"/>${eyes(46, 6, 3.4)}<path d="M50 52 l-4 6 h8z" fill="#f2a541"/>`;
  else if (shape === 'crawler') body = `<ellipse cx="50" cy="56" rx="38" ry="24" fill="url(#g${shape})" stroke="#b04cff" stroke-width="2"/>${[18, 30, 70, 82].map(x => `<path d="M${x} 72 l${x < 50 ? -6 : 6} 14" stroke="#b04cff" stroke-width="3" stroke-linecap="round"/>`).join('')}${eyes(50, 13, 5)}<circle cx="50" cy="48" r="4" fill="#e9c6ff"/>`;
  else if (shape === 'maw') body = `<circle cx="50" cy="50" r="42" fill="url(#g${shape})" stroke="#b04cff" stroke-width="3"/><path d="M22 56 Q50 92 78 56 Q50 70 22 56Z" fill="#0a0612"/>${[30, 40, 50, 60, 70].map(x => `<path d="M${x - 4} 59 l4 8 l4 -8" fill="#e9c6ff"/>`).join('')}${eyes(36, 16, 6)}<circle cx="50" cy="26" r="5" fill="#e9c6ff"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">${glow}${body}</svg>`;
}

const $app = () => document.getElementById('app');
function render() {
  if (!S.started) { $app().innerHTML = renderStart(); bind(); return; }
  let html = renderHUD() + `<main><div class="wrap">`;
  if (ui.tab === 'kennel') html += renderKennel();
  else if (ui.tab === 'adopt') html += renderAdopt();
  else if (ui.tab === 'world') html += renderWorld();
  else if (ui.tab === 'book') html += renderBook();
  else if (ui.tab === 'guide') html += renderGuide();
  html += `</div></main>`;
  if (B) html += renderBattle();
  if (ui.modal) html += `<div class="modal" role="dialog" aria-modal="true"><div class="panel">${ui.modal}</div></div>`;
  if (ui.toast) html += `<div class="toast" role="status">${esc(ui.toast)}</div>`;
  $app().innerHTML = html;
  bind();
  if (ui.tab === 'world' && run && !B) drawMap();
  const bl = document.querySelector('.blog'); if (bl) bl.scrollTop = bl.scrollHeight;
}
let toastTimer;
function toast(msg) { ui.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { ui.toast = null; render(); }, 2600); }

function pips(n) { return `<span class="pips">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`; }

const W = 22, H = 15, T = 32;
function genMap(depth) {
  const tiles = Array.from({ length: H }, () => Array(W).fill(0));
  // obstacles: clustered trees/rocks/water
  const blobs = 9 + depth;
  for (let i = 0; i < blobs; i++) {
    const cx = rint(0, W - 1), cy = rint(0, H - 1), r = rint(1, 2), t = pick([1, 1, 2, 3]);
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++)
      if (x >= 0 && y >= 0 && x < W && y < H && Math.random() < 0.7) tiles[y][x] = t;
  }
  for (let i = 0; i < 6 + depth * 2; i++) { const x = rint(0, W - 1), y = rint(0, H - 1); if (!tiles[y][x]) tiles[y][x] = 4; } // void cracks (walkable decor)
  const sx = 1, sy = Math.floor(H / 2);
  for (let y = sy - 1; y <= sy + 1; y++) for (let x = 0; x <= 2; x++) tiles[y][x] = 0;
  // reachable cells
  const walk = (x, y) => x >= 0 && y >= 0 && x < W && y < H && (tiles[y][x] === 0 || tiles[y][x] === 4);
  const dist = {}, q = [[sx, sy]]; dist[sx + ',' + sy] = 0;
  while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy, k = nx + ',' + ny; if (walk(nx, ny) && dist[k] === undefined) { dist[k] = dist[x + ',' + y] + 1; q.push([nx, ny]); } } }
  const cells = Object.keys(dist).filter(k => dist[k] > 2);
  cells.sort((a, b) => dist[b] - dist[a]);
  const items = {};
  const portal = cells[0]; items[portal] = { t: 'portal' };
  if (depth % 3 === 0) items[portal].boss = true;
  const free = cells.slice(1).sort(() => Math.random() - 0.5);
  const put = (t, n, extra = {}) => { for (let i = 0; i < n && free.length; i++) items[free.pop()] = { t, ...extra }; };
  put('monster', 5 + depth);
  put('treat', 4);
  put('chest', 2 + Math.floor(depth / 2));
  put('gem', 1 + Math.floor(depth / 3));
  if (Math.random() < 0.55) put('lostdog', 1);
  items[sx + ',' + sy] = { t: 'camp' };
  return { tiles, items, depth, px: sx, py: sy, seen: {} };
}
function partyDogs() { return S.party.map(dogById).filter(Boolean); }
function vision() { return 3 + (partyDogs().some(d => d.breed === 'beagle') ? 2 : 0); }
function startRun() {
  if (!S.party.length) return toast('Add at least one trail-ready dog to your party first.');
  run = { depth: 1, map: genMap(1), loot: { coins: 0, treats: 0 }, hp: {}, found: [] };
  for (const d of partyDogs()) run.hp[d.id] = stats(d).hp;
  reveal(); save(); render();
}
function reveal() {
  const m = run.map, v = vision();
  for (let y = m.py - v; y <= m.py + v; y++) for (let x = m.px - v; x <= m.px + v; x++)
    if ((x - m.px) ** 2 + (y - m.py) ** 2 <= v * v + 1) m.seen[x + ',' + y] = 1;
}
function step(dx, dy) {
  if (!run || B || ui.modal) return;
  const m = run.map, nx = m.px + dx, ny = m.py + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
  const t = m.tiles[ny][nx]; if (t !== 0 && t !== 4) return;
  if (partyDogs().every(d => run.hp[d.id] <= 0)) return toast('Your pack is too hurt to move. Feed them treats or head home.');
  m.px = nx; m.py = ny; reveal();
  const k = nx + ',' + ny, it = m.items[k];
  if (it) interact(k, it);
  save(); render();
}
function interact(k, it) {
  const m = run.map, corgi = partyDogs().some(d => d.breed === 'corgi') ? 1.3 : 1;
  const depthMul = 1 + 0.35 * (run.depth - 1);
  if (it.t === 'treat') { const n = rint(1, 2); run.loot.treats += n; delete m.items[k]; toast(`Found ${n} treat${n > 1 ? 's' : ''}!`); }
  else if (it.t === 'chest') { const n = Math.round(rint(12, 24) * depthMul * corgi); run.loot.coins += n; const tr = Math.random() < 0.4 ? 1 : 0; run.loot.treats += tr; delete m.items[k]; toast(`Dug up a buried chest: ${n} coins${tr ? ' and a treat' : ''}!`); }
  else if (it.t === 'gem') { const n = Math.round(rint(35, 55) * depthMul * corgi); run.loot.coins += n; delete m.items[k]; toast(`A void crystal worth ${n} coins!`); }
  else if (it.t === 'lostdog') {
    delete m.items[k];
    if (S.dogs.length >= 12) { toast('A lost dog wags at you, but your kennel is full.'); return; }
    const keys = Object.keys(BREEDS), rare = Math.random() < 0.25 + run.depth * 0.05;
    const pool = keys.filter(b => rare ? BREEDS[b].rarity !== 'common' : true);
    const dog = makeDog(pick(pool), { age: Math.random() < 0.5 ? 0 : rint(ADULT_AT, ADULT_AT + 5), bond: 30 });
    S.dogs.push(dog); S.seen[dog.breed] = 1; run.found.push(dog.id);
    toast(`You found a lost ${BREEDS[dog.breed].name}! ${dog.name} follows you home.`);
  }
  else if (it.t === 'monster') { startBattle(k, false); }
  else if (it.t === 'portal') {
    if (it.boss) { startBattle(k, true); return; }
    descend();
  }
  else if (it.t === 'camp' && run.map.depth === run.depth && Object.keys(run.loot).some(x => run.loot[x] > 0)) {
    ui.modal = `<h2>Back at camp</h2><p class="sub" style="margin:0">Head home with ${run.loot.coins} coins and ${run.loot.treats} treats?</p><div class="row"><button class="btn primary" data-act="gohome">Head home</button><button class="btn" data-act="closemodal">Keep exploring</button></div>`;
  }
}
function descend() {
  run.depth++; S.maxDepth = Math.max(S.maxDepth, run.depth);
  run.map = genMap(run.depth); reveal();
  toast(`You slip through the rift to depth ${run.depth}.${run.depth % 3 === 0 ? ' Something big waits at the far end…' : ''}`);
}
function goHome(lost) {
  if (!run) return;
  if (!lost) { S.coins += run.loot.coins; S.treats += run.loot.treats; }
  const msg = lost ? 'Your pack limps home. The loot was lost in the void.' : `Home safe with ${run.loot.coins} coins and ${run.loot.treats} treats.`;
  run = null; ui.modal = null; B = null; ui.tab = 'kennel';
  endDay(msg);
  render();
}
function feedInField(id) {
  const d = dogById(id); if (!d || S.treats < 1) return toast('No treats left at home. Bring some loot back first.');
  const max = stats(d).hp; if (run.hp[id] >= max) return;
  S.treats--; run.hp[id] = Math.min(max, Math.max(0, run.hp[id]) + Math.round(max * 0.4)); addBond(d, 2);
  toast(`${d.name} gobbles the treat and perks up.`); save(); render();
}

function drawMap() {
  const c = document.getElementById('map'); if (!c) return;
  const g = c.getContext('2d'), m = run.map, v = vision(), sniff = partyDogs().some(d => d.breed === 'beagle');
  const tint = Math.min(1, (run.depth - 1) * 0.12);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = m.tiles[y][x], px = x * T, py = y * T;
    const n = ((x * 73856093) ^ (y * 19349663) ^ (run.depth * 83492791)) & 7;
    g.fillStyle = mix(['#3f6b3a', '#43703d', '#3b6536', '#466f3f'][n & 3], '#3a2a5a', tint); g.fillRect(px, py, T, T);
    if (t === 1) { g.fillStyle = '#24452a'; g.beginPath(); g.arc(px + 16, py + 15, 13, 0, 7); g.fill(); g.fillStyle = '#2f5a35'; g.beginPath(); g.arc(px + 12, py + 11, 6, 0, 7); g.fill(); }
    if (t === 2) { g.fillStyle = '#6d6a72'; g.beginPath(); g.ellipse(px + 16, py + 18, 13, 10, 0, 0, 7); g.fill(); g.fillStyle = '#8a8790'; g.beginPath(); g.ellipse(px + 12, py + 14, 5, 3, 0, 0, 7); g.fill(); }
    if (t === 3) { g.fillStyle = mix('#2d6f9c', '#3a2a6a', tint); g.fillRect(px, py, T, T); g.strokeStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.moveTo(px + 6, py + 12 + (n & 3)); g.lineTo(px + 16, py + 12 + (n & 3)); g.stroke(); }
    if (t === 4) { g.strokeStyle = 'rgba(176,76,255,.65)'; g.lineWidth = 2; g.beginPath(); g.moveTo(px + 6, py + 8); g.lineTo(px + 14, py + 18); g.lineTo(px + 11, py + 24); g.lineTo(px + 22, py + 28); g.stroke(); g.lineWidth = 1; }
  }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '20px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  const icons = { treat: '🦴', chest: '🎁', gem: '💎', lostdog: '🐶', portal: '🌀', camp: '⛺' };
  const now = performance.now() / 600;
  for (const k in m.items) {
    const [x, y] = k.split(',').map(Number), it = m.items[k];
    const visible = m.seen[k] || (sniff && it.t === 'chest');
    if (!visible) continue;
    const cx = x * T + 16, cy = y * T + 16;
    if (it.t === 'monster' || it.boss) {
      const r = it.boss ? 14 : 10 + Math.sin(now + x) * 1.5;
      const grd = g.createRadialGradient(cx, cy, 2, cx, cy, r + 6); grd.addColorStop(0, '#b04cff'); grd.addColorStop(1, 'rgba(176,76,255,0)');
      g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, r + 6, 0, 7); g.fill();
      g.fillStyle = '#1c0b33'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
      g.fillStyle = '#e9c6ff'; g.beginPath(); g.arc(cx - 4, cy - 2, 2.2, 0, 7); g.arc(cx + 4, cy - 2, 2.2, 0, 7); g.fill();
      if (it.t === 'portal') { g.globalAlpha = .5; g.fillText('🌀', cx, cy + 1); g.globalAlpha = 1; }
    } else g.fillText(icons[it.t], cx, cy + 1);
  }
  // fog
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = x + ',' + y, inView = (x - m.px) ** 2 + (y - m.py) ** 2 <= v * v + 1;
    if (!m.seen[k]) { g.fillStyle = '#0a0812'; g.fillRect(x * T, y * T, T, T); }
    else if (!inView) { g.fillStyle = 'rgba(10,8,18,.5)'; g.fillRect(x * T, y * T, T, T); }
  }
  // sniffed chests show through fog
  if (sniff) for (const k in m.items) if (m.items[k].t === 'chest' && !m.seen[k]) { const [x, y] = k.split(',').map(Number); g.globalAlpha = .55; g.fillText('🎁', x * T + 16, y * T + 17); g.globalAlpha = 1; }
  // player: lead dog head
  const lead = partyDogs()[0];
  if (lead) {
    const b = BREEDS[lead.breed], cx = m.px * T + 16, cy = m.py * T + 16;
    g.fillStyle = 'rgba(242,165,65,.35)'; g.beginPath(); g.arc(cx, cy, 15, 0, 7); g.fill();
    g.fillStyle = b.ear; g.beginPath(); g.arc(cx - 9, cy - 6, 5, 0, 7); g.arc(cx + 9, cy - 6, 5, 0, 7); g.fill();
    g.fillStyle = b.coat; g.beginPath(); g.arc(cx, cy, 10, 0, 7); g.fill();
    g.fillStyle = b.muzzle; g.beginPath(); g.ellipse(cx, cy + 4, 5.5, 4, 0, 0, 7); g.fill();
    g.fillStyle = '#1a1412'; g.beginPath(); g.arc(cx - 4, cy - 2, 1.6, 0, 7); g.arc(cx + 4, cy - 2, 1.6, 0, 7); g.arc(cx, cy + 2.5, 2, 0, 7); g.fill();
  }
}

function spawnGroup(depth, boss) {
  const scale = 1 + 0.18 * (depth - 1);
  const mk = key => { const m = MONSTERS[key]; const hp = Math.round(m.hp * scale); return { key, name: m.name, hp, max: hp, atk: m.atk * scale, def: m.def * scale, xp: Math.round(m.xp * scale), weak: 0, mark: 0, stun: 0, boss: !!m.boss, turn: 0 }; };
  if (boss) return [mk('maw'), mk(pick(['wisp', 'crow']))];
  const pool = depth === 1 ? ['wisp', 'shade', 'crow'] : ['wisp', 'shade', 'crow', 'crawler'];
  const n = rint(1, Math.max(1, Math.min(3, S.party.length, 1 + Math.ceil(depth / 2))));
  return Array.from({ length: n }, () => mk(pick(pool)));

    const ks = movesOf(a.d), n = parseInt(e.key, 10);
    if (n >= 1 && n <= ks.length) { useMove(ks[n - 1]); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') { useMove('rest'); e.preventDefault(); }
    else if (e.key === 'Tab') { const live = B.foes.map((f, i) => f.hp > 0 ? i : -1).filter(i => i >= 0); B.target = live[(live.indexOf(B.target) + 1) % live.length]; render(); e.preventDefault(); }
    return;
  }
  if (ui.tab !== 'world' || !run || B || ui.modal) return;
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (k) { step(...k); e.preventDefault(); }
});

// ============================================================
// BOOT
// ============================================================
function start(hot) {
  S = (hot && hot.S) || load() || newState();
  run = S.run || null;
  if (run && !run.map) run = null;
  if (S.started && !S.shop.length) rollShop();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S: Object.assign({}, S, { run }) }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
