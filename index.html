<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Dog — Swimming Hole</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5e8; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 10px; left: 10px; font: 12px/1.3 ui-monospace, monospace; color: #fff;
      background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 6px; display: none; }
    #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font: 14px system-ui, sans-serif;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="help">WASD / arrows or drag to swim · Space to splash · F3 stats</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
